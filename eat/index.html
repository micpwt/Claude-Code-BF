  function pointerSvg() {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("class", "pointer"); s.setAttribute("viewBox", "0 0 28 34");
    s.innerHTML = '<path d="M14 33 2 9a12 12 0 1 1 24 0z" fill="var(--accent)"/><circle cx="14" cy="11" r="4.5" fill="var(--card)"/>';

  /* ---------- wheel ---------- */
  function weightFor(p) {
    const prefs = wheelMode === "both" ? [p.prefHer, p.prefHim] : [wheelMode === "her" ? p.prefHer : p.prefHim];
    if (prefs.includes("no")) return 0;
    return 1 + prefs.filter((x) => x === "love").length;
  }
  function candidates() {
    return placeList()
      .filter((p) => wheelCat === "all" || (p.cat || "other") === wheelCat)
      .filter((p) => explore || isUnlocked(p))
      .map((p) => ({ p, w: weightFor(p) }))
      .filter((x) => x.w > 0)
      .sort((a, b) => (a.p.cat || "").localeCompare(b.p.cat || "") || (a.p.createdAt || "").localeCompare(b.p.createdAt || ""));
  }
  function drawWheel() {
    const cv = $("#wheel"); if (!cv) return;
    const ctx = cv.getContext("2d"), S = cv.width, R = S / 2 - 8;
    const cs = getComputedStyle(document.documentElement);
    const cands = candidates();
    ctx.clearRect(0, 0, S, S);
    ctx.save(); ctx.translate(S / 2, S / 2);
    if (!cands.length) {
      ctx.fillStyle = cs.getPropertyValue("--fill"); ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fill(); ctx.restore(); return;
    }
    const total = cands.reduce((s, x) => s + x.w, 0);
    let a = wheelAngle - Math.PI / 2;
    const card = cs.getPropertyValue("--card").trim();
    cands.forEach((x, i) => {
      const span = x.w / total * Math.PI * 2;
      const col = cs.getPropertyValue(`--c-${cat(x.p.cat).k}`).trim();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, a, a + span); ctx.closePath();
      ctx.fillStyle = col; ctx.globalAlpha = i % 2 ? .78 : 1; ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = card; ctx.lineWidth = 4; ctx.stroke();
      const mid = a + span / 2, cosm = Math.cos(mid);
      ctx.save(); ctx.rotate(cosm < 0 ? mid + Math.PI : mid);
      ctx.fillStyle = "#fff"; ctx.textAlign = cosm < 0 ? "left" : "right"; ctx.textBaseline = "middle";
      const fs = Math.max(18, Math.min(30, span * R * .42));
      ctx.font = `600 ${fs}px ${cs.getPropertyValue("--font")}`;
      let label = x.p.name; if (label.length > 7) label = label.slice(0, 6) + "…";
      if (!isUnlocked(x.p)) label = "🔒" + label;
      if (span * R > 22) ctx.fillText(label, cosm < 0 ? -(R - 22) : R - 22, 0);
      ctx.restore();
      a += span;
    });
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.strokeStyle = card; ctx.lineWidth = 8; ctx.stroke();
    ctx.restore();
  }
  function spin() {
    const cands = candidates(); if (!cands.length || spinning) return;
    const total = cands.reduce((s, x) => s + x.w, 0);
    let r = Math.random() * total, idx = 0;
    for (; idx < cands.length; idx++) { r -= cands[idx].w; if (r <= 0) break; }
    idx = Math.min(idx, cands.length - 1);
    let start = 0; for (let i = 0; i < idx; i++) start += cands[i].w;
    const span = cands[idx].w;
    const mid = (start + span * (.2 + Math.random() * .6)) / total * Math.PI * 2;
    // pointer at top: wheel angle such that segment mid sits at -90deg
    const target = -mid;
    const from = wheelAngle;
    const base = from - (from % (Math.PI * 2));
    const to = base + Math.PI * 2 * 6 + ((target % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const dur = reduce ? 1 : 3800, t0 = performance.now();
    spinning = true; lastPick = null;
    const btn = $("#spin"); if (btn) { btn.disabled = true; btn.textContent = "…"; }
    const step = (t) => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 4);
      wheelAngle = from + (to - from) * e; drawWheel();
      if (k < 1) requestAnimationFrame(step);
      else { spinning = false; wheelAngle = to % (Math.PI * 2); lastPick = cands[idx].p.id; render(); $("#result")?.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" }); }
    };
    requestAnimationFrame(step);
  }

  /* ---------- calendar ---------- */
  function viewCal() {
    const first = new Date(calY, calM, 1);
    const lead = (first.getDay() + 6) % 7;
    const days = new Date(calY, calM + 1, 0).getDate();
    const byDay = {}; for (const m of meals) (byDay[m.date] ||= []).push(m);
    const t = todayStr();
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push(h("div", { class: "day out", "aria-hidden": "true" }));
    for (let d = 1; d <= days; d++) {
      const ds = ymd(new Date(calY, calM, d));
      const ms = (byDay[ds] || []).sort((a, b) => SLOTS.findIndex((s) => s.k === a.slot) - SLOTS.findIndex((s) => s.k === b.slot));
      cells.push(h("button", { class: "day" + (ds === t ? " today" : ""), "aria-pressed": String(ds === selDay), "aria-label": `${md(ds)}，${ms.length} 顿`, onclick: () => { selDay = ds; render(); } },

    const monthMeals = meals.filter((m) => m.date.startsWith(monthKey));
    const mc = {}; for (const m of monthMeals) mc[m.placeId] = (mc[m.placeId] || 0) + 1;
    const top = Object.entries(mc).sort((a, b) => b[1] - a[1])[0];
    const dayMeals = (byDay[selDay] || []).sort((a, b) => SLOTS.findIndex((s) => s.k === a.slot) - SLOTS.findIndex((s) => s.k === b.slot));

    return [

          h("b", {}, `${calY}年${calM + 1}月`),
          h("button", { class: "nav", "aria-label": "下个月", onclick: () => { calM++; if (calM > 11) { calM = 0; calY++; } render(); } }, "›")),
        h("div", { class: "grid" }, "一二三四五六日".split("").map((x) => h("div", { class: "dow" }, x)), cells)),
      h("p", { class: "muted", style: "margin:-8px 4px 0" }, monthMeals.length
        ? `这个月吃了 ${monthMeals.length} 顿，最常去的是「${places[top[0]]?.name || "已删除"}」${top[1]} 次（${pct(top[1], monthMeals.length)}）`
        : (loaded.meals ? "这个月还没有记录" : "正在加载…")),
      h("div", { class: "sec-h" }, h("h2", {}, md(selDay)), h("span", {}, dayMeals.length ? `${dayMeals.length} 顿` : "")),
      h("div", { class: "card list" }, dayMeals.map(mealRow),
        h("button", { class: "add-row", onclick: () => openMeal({ date: selDay }) }, `＋ 记下${selDay === t ? "今天" : "这天"}吃了什么`)),
    ];
  }

  /* ---------- places ---------- */
  function viewPlaces() {
    const cnt = countsByPlace(), total = meals.length;
    const all = placeList();

    const filt = (p) => placeFilter === "all" || (p.cat || "other") === placeFilter;

  function openMeal(m) {

          onclick: () => { st.placeId = p.id; paintList(); } },
          h("span", { class: "ico", style: `--cat:${catVar(p.cat)}` }, cat(p.cat).em),
          h("span", { class: "row-main" }, h("b", {}, p.name), h("small", {}, cat(p.cat).name + (isUnlocked(p) ? "" : " · 🔒 第一次吃"))),
          h("span", { class: "check" }, "✓")))
        : [h("div", { class: "empty", style: "padding:16px" }, "没有找到，先到“餐厅”里添加")]));
    }
    paintList();
    const body = [
      h("div", { class: "field" }, h("label", { class: "lbl", for: "m-date" }, "日期"), dateIn),
      h("div", { class: "field" }, h("span", { class: "lbl" }, "哪一顿"), segCtl(SLOTS.map((s) => [s.k, s.name]), st.slot, (v) => { st.slot = v; })),
      h("div", { class: "field" }, h("span", { class: "lbl" }, "吃了哪家"), search, listBox),
      h("div", { class: "field" }, h("span", { class: "lbl" }, "最后谁决定的"), segCtl([["her", "她决定"], ["him", "他决定"]], st.decidedBy, (v) => { st.decidedBy = v; })),
    ];
    if (editing) body.push(delBtn(async () => { if (await write(() => db.collection("meals").doc(m.id).delete())) { closeSheet(); toast("已删除"); } }));
    showSheet(editing ? "改一下这顿" : "记一顿", body, async () => {
      if (!st.placeId) { toast("选一下吃了哪家"); return; }
      const id = `${st.date}_${st.slot}`;
      const data = { date: st.date, slot: st.slot, placeId: st.placeId, decidedBy: st.decidedBy, by: me, at: new Date().toISOString() };
      const ok = await write(async () => {
        if (editing && m.id !== id) await db.collection("meals").doc(m.id).delete();
        await db.collection("meals").doc(id).set(data);
        const p = places[st.placeId];
        if (p && !isUnlocked(p)) await db.collection("places").doc(p.id).update({ unlockedAt: data.at });
      });
      if (ok) { closeSheet(); lastPick = null; toast(`记下了：${SLOT[st.slot]} · ${places[st.placeId]?.name || ""}`); }
    });
  }
  function defaultSlot(date) {
    const hr = new Date().getHours();
    const s = hr < 16 ? "lunch" : hr < 22 ? "dinner" : "late";
    const d = date || todayStr();
    if (!meals.some((m) => m.date === d && m.slot === s)) return s;
    return SLOTS.find((x) => !meals.some((m) => m.date === d && m.slot === x.k))?.k || s;
  }

  function openPlace(p) {
    const editing = !!p?.id;
    const st = { name: p?.name || "", cat: p?.cat || (placeFilter !== "all" ? placeFilter : "zh"), isDefault: !!p?.isDefault, prefHer: p?.prefHer || "", prefHim: p?.prefHim || "" };
    const nameIn = h("input", { type: "text", id: "p-name", value: st.name, placeholder: "餐厅名字", oninput: (e) => { st.name = e.target.value; } });
    const catBox = h("div", { class: "chipgrid" });
    const paintCat = () => catBox.replaceChildren(...CATS.map((c) => h("button", { type: "button", class: "chip", "aria-pressed": String(st.cat === c.k), onclick: () => { st.cat = c.k; paintCat(); } }, `${c.em} ${c.name}`)));
    paintCat();
    const prefOpts = [["love", "爱吃"], ["ok", "还行"], ["no", "不想吃"]];
    const n = editing ? (countsByPlace()[p.id] || 0) : 0;
    const body = [
      h("div", { class: "field" }, h("label", { class: "lbl", for: "p-name" }, "名字"), nameIn),
      h("div", { class: "field" }, h("span", { class: "lbl" }, "分类"), catBox),
      h("label", { class: "toggle-card toggle-row" }, h("span", {}, "常吃的店", h("small", {}, "平时就会去，不用解锁")),
        h("span", { class: "switch" }, h("input", { type: "checkbox", id: "p-default", checked: st.isDefault, onchange: (e) => { st.isDefault = e.target.checked; } }), h("i"))),
      h("div", { class: "field" }, h("span", { class: "lbl" }, "喜好（转盘会照这个来：爱吃的更容易转到，不想吃的不会出现）"),
        h("div", { class: "pref-row" }, h("span", {}, "她"), segCtl(prefOpts, st.prefHer, (v) => { st.prefHer = v; })),
        h("div", { class: "pref-row" }, h("span", {}, "他"), segCtl(prefOpts, st.prefHim, (v) => { st.prefHim = v; }))),
    ];
    if (editing) body.push(
      h("p", { class: "muted", style: "margin:0 14px" }, n ? `吃过 ${n} 次，占全部的 ${pct(n, meals.length)}${p.unlockedAt && !p.isDefault ? `，${md(p.unlockedAt.slice(0, 10))}解锁` : ""}` : (isUnlocked(p) ? "还没有记录" : "🔒 还没解锁，第一次去吃就会解锁")),
      delBtn(async () => { if (await write(() => db.collection("places").doc(p.id).delete())) { closeSheet(); toast("已删除"); } }));
    showSheet(editing ? "编辑餐厅" : "添加餐厅", body, async () => {
      const name = st.name.trim();
      if (!name) { toast("写一下餐厅名字"); return; }
      const t = new Date().toISOString();
      const data = { name, cat: st.cat, isDefault: st.isDefault, prefHer: st.prefHer, prefHim: st.prefHim };
      const ok = await write(() => editing
        ? db.collection("places").doc(p.id).update({ ...data, updatedAt: t, updatedBy: me })
        : db.collection("places").add({ ...data, createdAt: t, createdBy: me, unlockedAt: st.isDefault ? t : null }));
      if (ok) { closeSheet(); toast(editing ? "已更新" : (st.isDefault ? "已添加" : "已添加到待解锁")); }
    });
  }

  /* ---------- unlock moment ---------- */
  const seenUnlock = new Set();
  let confettiRAF = 0;
  function celebrate(p) {
    if (seenUnlock.has(p.id)) return; seenUnlock.add(p.id);
    const c = cat(p.cat);
    $("#u-name").textContent = `${c.em} ${p.name}`;
    $("#u-meta").textContent = `${c.name} · 你们解锁的第 ${placeList().filter(isUnlocked).length} 家`;
    const u = $("#unlock"); u.hidden = false; u.classList.remove("on");
    void u.offsetWidth;
    requestAnimationFrame(() => u.classList.add("on"));
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setTimeout(confetti, 600);
    $("#u-ok").focus({ preventScroll: true });
  }
  function closeUnlock() {
    const u = $("#unlock"); u.classList.remove("on"); cancelAnimationFrame(confettiRAF);
    setTimeout(() => { if (!u.classList.contains("on")) u.hidden = true; }, 300);
  }
  $("#u-ok").addEventListener("click", closeUnlock);
  function confetti() {
    const cv = $("#confetti"), ctx = cv.getContext("2d");
    const dpr = Math.min(2, devicePixelRatio || 1);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
    const cs = getComputedStyle(document.documentElement);
    const cols = ["--gold", "--accent", "--c-xi", "--c-th", "--c-kr", "--c-fast"].map((v) => cs.getPropertyValue(v).trim());
    const cx = innerWidth / 2, cy = innerHeight / 2 - 60;
    const ps = Array.from({ length: 140 }, () => {
      const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 9;
      return { x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4, r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3, w: 6 + Math.random() * 6, h: 3 + Math.random() * 4, c: cols[(Math.random() * cols.length) | 0], life: 1 };
    });
    const step = () => {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      let alive = 0;
      for (const p of ps) {
        p.vy += .22; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .006;
        if (p.life <= 0 || p.y > innerHeight + 20) continue; alive++;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, p.life * 1.5);
        ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
      }
      if (alive) confettiRAF = requestAnimationFrame(step); else ctx.clearRect(0, 0, innerWidth, innerHeight);
    };
    confettiRAF = requestAnimationFrame(step);
  }

  /* ---------- wiring ---------- */
  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
    tab = b.dataset.tab; try { history.replaceState(null, "", "#" + tab); } catch {}
    render(); scrollTo({ top: 0 });
  }));
  $("#add").addEventListener("click", () => tab === "places" ? openPlace(null) : openMeal({ date: tab === "cal" ? selDay : todayStr() }));
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => tab === "today" && drawWheel());
  new MutationObserver(() => tab === "today" && drawWheel()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  render();

  (async () => {
    const c = window.claude;
    const notice = (msg) => { const n = $("#notice"); n.textContent = msg; n.hidden = false; };
    if (!c?.use) { loaded = { places: true, meals: true }; notice("在 Claude 里打开这个页面，才能保存和同步。"); render(); return; }
    const [d, user] = await Promise.all([c.use("db"), c.use("user")]);
    db = d;
    if (user) {
      me = await user.id();
      myRole = (await user.isOwner()) ? "her" : "him";
      if ((await user.can("data.write")) === false) { readOnly = true; notice("你现在只能查看。想一起记录，请让她在“分享”里把你设为“编辑者”。"); }
    }
    if (!db) { loaded = { places: true, meals: true }; notice("没连上存储：请先登录 Claude 再打开。"); render(); return; }
    let first = true;
    db.collection("places").onSnapshot((snap) => {
      const next = {};
      for (const doc of snap.docs) next[doc.id] = { id: doc.id, ...doc.data() };
      if (!first) for (const p of Object.values(next)) {
        const prev = places[p.id];
        if (prev && !isUnlocked(prev) && isUnlocked(p) && !p.isDefault) setTimeout(() => celebrate(p), 350);
      }
      first = false; places = next; loaded.places = true;
      if (!spinning) render();
    }, () => notice("同步中断了，刷新一下页面。"));
    db.collection("meals").onSnapshot((snap) => {
      meals = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() })).filter((m) => m.date);
      loaded.meals = true;
      if (!spinning) render();
    }, () => notice("同步中断了，刷新一下页面。"));
  })();
})();
</script>
