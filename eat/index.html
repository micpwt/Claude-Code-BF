<style>
/* Layout: iOS liquid-glass single column — drifting color field behind translucent cards, large title, floating glass tab bar + add button, glass bottom sheets, hold-to-unlock moment */

}

  --shade: rgba(0,0,0,.45); --fill: rgba(140,140,150,.2);
  --label: #FFFFFF; --label2: rgba(240,235,245,.64); --label3: rgba(240,235,245,.3); --sep: rgba(255,255,255,.1);
  --accent: #FF5479; --accent-soft: rgba(255,84,121,.2); --gold: #FFC23D;
  --red: #FF5A50; --yellow: #FFD23F; --green: #3DD26A; --scrim: rgba(0,0,0,.5);
  --c-zh: #FF6369; --c-cha: #E09A4E; --c-xi: #6B9BFF; --c-th: #4CC277;
  --c-jp: #FF7BA1; --c-kr: #AD83FF; --c-fast: #FFA640; --c-other: #9AA0AD;

} }
:root[data-theme="dark"] {
  --base: #0A080E;
  --blob1: #8A1E4A; --blob2: #7A4012; --blob3: #3B2A8F; --blob4: #0E5E4E;
  --glass: rgba(38,36,46,.5); --glass-strong: rgba(40,38,48,.82); --glass-edge: rgba(255,255,255,.13); --glass-hi: rgba(255,255,255,.22);
  --shade: rgba(0,0,0,.45); --fill: rgba(140,140,150,.2);
  --label: #FFFFFF; --label2: rgba(240,235,245,.64); --label3: rgba(240,235,245,.3); --sep: rgba(255,255,255,.1);

/* Color field behind the glass */

.field-bg i:nth-child(4) { width: 40vmax; height: 40vmax; right: -10vmax; bottom: -5vmax; background: var(--blob4); animation: drift1 35s ease-in-out infinite alternate-reverse; }

}

/* Segmented + chips */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--fill); border-radius: 14px; padding: 3px; gap: 2px; }

/* Rows */
.list { overflow: hidden; }

.slot { flex: none; font-size: 12px; font-weight: 650; color: var(--label2); background: var(--fill); padding: 3px 9px; border-radius: 99px; }
.add-row { display: flex; align-items: center; gap: 10px; padding: 14px 16px; color: var(--accent); font-weight: 650; width: 100%; position: relative; }
.dishes { display: flex; flex-wrap: wrap; gap: 4px 10px; }

/* Wheel */
.wheel-card { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.wheel-box { position: relative; width: 100%; max-width: 340px; aspect-ratio: 1; margin: 8px auto 0; }
.wheel-box::before { content: ""; position: absolute; inset: -10px; border-radius: 50%; background: var(--glass); box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 0 0 .5px var(--glass-edge), 0 14px 40px var(--shade); }

  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);

  display: grid; place-items: center; transition: transform .15s; z-index: 2;
  background: var(--glass-strong); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
  box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 0 0 .5px var(--glass-edge), 0 8px 24px var(--shade);
}

.prow + .prow::before { content: ""; position: absolute; top: 0; left: 66px; right: 0; border-top: .5px solid var(--sep); }
.prow:active { background: var(--fill); }

.prow .num b { font-size: 16px; font-weight: 700; }

.bar { grid-column: 2 / 4; height: 5px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--cat, var(--accent)); }

.pf.love { color: var(--accent); background: var(--accent-soft); }
.pf.no { color: var(--red); }
.locked .ico { filter: grayscale(1); opacity: .55; }
.locked .row-main b { color: var(--label2); }
.lock-tag { font-size: 12px; color: var(--gold); font-weight: 700; }
.empty { padding: 26px 20px; text-align: center; color: var(--label2); font-size: 15px; display: flex; flex-direction: column; gap: 10px; align-items: center; }

/* Floating chrome */
.dock {

}
.dock-in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.tabs { pointer-events: auto; display: flex; padding: 5px; border-radius: 99px; gap: 2px; }
.tabs button { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 16px 5px; border-radius: 99px; font-size: 11px; font-weight: 650; min-width: 66px; transition: background .25s, color .25s; }
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-selected="true"] { color: var(--accent); background: var(--glass-strong); box-shadow: inset 0 0 0 .5px var(--glass-edge); }
.fab { pointer-events: auto; width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; color: var(--accent); flex: none; }
.fab:active, .tabs button:active { transform: scale(.93); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; opacity: 0; transition: opacity .25s; }
.scrim.on { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; max-height: 92%;
  display: flex; flex-direction: column; border-radius: 30px 30px 0 0;
  background: var(--glass-strong); -webkit-backdrop-filter: blur(40px) saturate(190%); backdrop-filter: blur(40px) saturate(190%);
  box-shadow: inset 0 1px 0 var(--glass-hi), inset 0 0 0 .5px var(--glass-edge), 0 -10px 40px var(--shade);
  transform: translateY(105%); transition: transform .38s cubic-bezier(.2,.9,.25,1); max-width: 680px; margin: 0 auto;
}
.sheet.on { transform: none; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--label3); margin: 8px auto 0; flex: none; }
.sheet-bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 8px 16px 6px; flex: none; }
.sheet-bar h3 { margin: 0; font-size: 17px; font-weight: 650; }
.sheet-bar .l { justify-self: start; } .sheet-bar .r { justify-self: end; }
.pill { height: 36px; padding: 0 16px; border-radius: 99px; background: var(--fill); font-size: 16px; font-weight: 550; }
.pill.primary { background: var(--accent); color: #fff; font-weight: 650; }
.pill:disabled { opacity: .45; }
.sheet-body {
  overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px;
}
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld > .lbl { font-size: 13px; color: var(--label2); padding: 0 14px; letter-spacing: .02em; }
.inp {
  width: 100%; border: 0; outline: none; background: var(--fill); border-radius: 14px; padding: 13px 14px; font-size: 16px; min-height: 48px;
}
.inp:focus { box-shadow: inset 0 0 0 1.5px var(--accent); }
.box { background: var(--fill); border-radius: 18px; }
.opt-list { max-height: 250px; overflow-y: auto; }
.opt { display: flex; align-items: center; gap: 12px; padding: 10px 14px; width: 100%; text-align: left; position: relative; }
.opt + .opt::before { content: ""; position: absolute; top: 0; left: 64px; right: 0; border-top: .5px solid var(--sep); }
.opt[aria-pressed="true"] { background: var(--accent-soft); }
.opt .check { margin-left: auto; color: var(--accent); font-weight: 800; visibility: hidden; }
.opt[aria-pressed="true"] .check { visibility: visible; }
.opt.new { color: var(--accent); font-weight: 650; }
.opt.new .ico { background: var(--accent-soft); box-shadow: none; color: var(--accent); font-size: 22px; }
.pref-row { display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 10px; }
.pref-row > span { font-size: 15px; font-weight: 650; padding-left: 6px; }
.danger { background: var(--fill); color: var(--red); border-radius: 14px; height: 50px; font-size: 16px; font-weight: 550; width: 100%; }
.danger.confirm { background: var(--red); color: #fff; font-weight: 650; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--fill); border-radius: 14px; padding: 10px 14px; min-height: 52px; }
.toggle-row small { display: block; font-size: 13px; color: var(--label2); }
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--fill); transition: background .2s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .22s; }
.switch input:checked + i { background: var(--green); }
.switch input:checked + i::after { transform: translateX(20px); }

/* Dish + taste slider */
.dish { background: var(--fill); border-radius: 18px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.dish-top { display: flex; align-items: center; gap: 8px; }
.dish-top input { flex: 1; min-width: 0; border: 0; outline: none; background: none; font-size: 16px; font-weight: 600; padding: 6px 2px; }
.dish-top input::placeholder { color: var(--label3); font-weight: 500; }
.x { width: 28px; height: 28px; border-radius: 50%; background: var(--fill); color: var(--label2); font-size: 15px; flex: none; }
.taste { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
.taste .face { min-width: 74px; display: flex; align-items: center; gap: 4px; justify-content: flex-end; font-size: 13px; font-weight: 650; color: var(--label2); }
.taste .face span { font-size: 24px; transition: transform .15s; }
.taste-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--label2); padding: 0 2px; margin-top: -4px; grid-column: 1; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; background: none; margin: 0; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--red), var(--yellow) 50%, var(--green)); }
input[type="range"]::-moz-range-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--red), var(--yellow) 50%, var(--green)); }

input[type="range"]::-moz-range-thumb { width: 30px; height: 30px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.add-dish { height: 44px; border-radius: 14px; border: 1.5px dashed var(--label3); color: var(--accent); font-weight: 650; }
.dish-stats { display: flex; flex-direction: column; }
.dish-stats div { display: flex; align-items: center; gap: 10px; padding: 9px 14px; font-size: 15px; }
.dish-stats div + div { border-top: .5px solid var(--sep); }
.dish-stats b { flex: 1; min-width: 0; font-weight: 550; overflow-wrap: anywhere; }
.dish-stats small { color: var(--label2); font-size: 13px; font-variant-numeric: tabular-nums; }

/* Unlock moment */

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const h = (tag, props = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "style") el.style.cssText = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);

    for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
    return el;
  };
  const reduceMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  const CATS = [
    { k: "zh", name: "中餐", em: "🥢" }, { k: "cha", name: "茶餐厅", em: "🫖" },
    { k: "xi", name: "西餐", em: "🍝" }, { k: "th", name: "泰国餐", em: "🍛" },
    { k: "jp", name: "日料", em: "🍣" }, { k: "kr", name: "韩餐", em: "🥘" },
    { k: "fast", name: "快餐", em: "🍔" }, { k: "other", name: "其他", em: "🍽️" },
  ];
  const CAT = Object.fromEntries(CATS.map((c) => [c.k, c]));
  const cat = (k) => CAT[k] || CAT.other;
  const catVar = (k) => `var(--c-${cat(k).k})`;
  const SLOTS = [{ k: "lunch", name: "午餐" }, { k: "dinner", name: "晚餐" }, { k: "late", name: "宵夜" }];
  const SLOT = Object.fromEntries(SLOTS.map((s) => [s.k, s.name]));
  const slotIdx = (m) => SLOTS.findIndex((s) => s.k === m.slot);
  const WHO = { her: "她", him: "他" };
  const PREF = { love: "爱吃", ok: "还行", no: "不想吃" };
  const taste = (s) => s < 20 ? ["🤢", "踩雷"] : s < 45 ? ["😕", "不太行"] : s < 70 ? ["🙂", "还可以"] : s < 90 ? ["😋", "好吃"] : ["🤩", "超好吃"];

  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const todayStr = () => ymd(new Date());
  const md = (s) => { const [, m, d] = s.split("-"); return `${+m}月${+d}日`; };
  const pct = (n, t) => { if (!t) return "0%"; const v = n / t * 100; return (v < 10 && n ? v.toFixed(1) : Math.round(v)) + "%"; };

  /* ---------- state ---------- */
  let tab = ["today", "cal", "places"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "today";
  let places = {}, meals = [];
  let loaded = { places: false, meals: false };
  let db = null, me = null, myRole = "her", readOnly = false;
  let wheelCat = "all", wheelMode = "both", spinning = false, lastPick = null, wheelAngle = 0;
  const now = new Date();
  let calY = now.getFullYear(), calM = now.getMonth(), selDay = todayStr();
  let placeFilter = "all";

  const placeList = () => Object.values(places);
  const countsByPlace = () => { const c = {}; for (const m of meals) c[m.placeId] = (c[m.placeId] || 0) + 1; return c; };
  const isUnlocked = (p) => !!p.unlockedAt || !!p.isDefault;
  function dishStats(placeId) {
    const by = {};
    for (const m of meals) if (m.placeId === placeId) for (const d of m.dishes || []) {
      const k = d.name.trim(); if (!k) continue;
      (by[k] ||= { name: k, sum: 0, n: 0 }); by[k].sum += d.score; by[k].n++;
    }
    return Object.values(by).map((x) => ({ ...x, avg: x.sum / x.n })).sort((a, b) => b.avg - a.avg || b.n - a.n);
  }

  let toastT;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2300); }

  async function write(fn) {
    if (!db) { toast("没连上存储，暂时不能保存"); return false; }
    if (readOnly) { toast("你现在只能查看，请让她把你设为“编辑者”"); return false; }
    try { await fn(); return true; }
    catch (e) {
      if (e && e.code === "invalid_argument") { readOnly = true; toast("没有编辑权限，请让她把你设为“编辑者”"); }
      else if (e && e.code === "quota_exceeded") toast("存储满了，删掉一些旧记录再试");
      else toast("保存失败，请稍后再试");
      return false;
    }
  }

  /* ---------- views ---------- */
  function render() {
    const titles = { today: "今天吃什么", cal: "吃过什么", places: "我们的餐厅" };
    $("#title").textContent = titles[tab];
    const d = new Date();
    $("#eyebrow").textContent = `${d.getMonth() + 1}月${d.getDate()}日 · 星期${"日一二三四五六"[d.getDay()]}`;
    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
    $("#view").replaceChildren(...(tab === "today" ? viewToday() : tab === "cal" ? viewCal() : viewPlaces()));
    if (tab === "today") drawWheel();
  }

  function mealRow(m) {
    const p = places[m.placeId], c = cat(p?.cat);
    const ds = (m.dishes || []).filter((d) => d.name);
    return h("button", { class: "row", onclick: () => openMeal(m) },
      h("span", { class: "ico", style: `--cat:${catVar(p?.cat)}` }, c.em),
      h("span", { class: "row-main" }, h("b", {}, p ? p.name : "（已删除的餐厅）"),
        ds.length ? h("small", { class: "dishes" }, ds.map((d) => h("span", {}, `${d.name} ${taste(d.score)[0]}`)))
          : h("small", {}, `${c.name} · ${WHO[m.decidedBy] || "?"}决定的`)),
      h("span", { class: "slot" }, SLOT[m.slot] || ""));
  }

  function viewToday() {
    const t = todayStr();
    const todays = meals.filter((m) => m.date === t).sort((a, b) => slotIdx(a) - slotIdx(b));
    const todayCard = h("div", { class: "card list" },
      todays.map(mealRow),
      h("button", { class: "add-row", onclick: () => openMeal({ date: t }) }, todays.length ? "＋ 再记一顿" : "＋ 记下今天吃了什么"));

    const all = placeList();
    const cands = candidates();
    const chips = h("div", { class: "chips", role: "group", "aria-label": "分类" },
      [{ k: "all", name: "全部", em: "" }, ...CATS].filter((c) => c.k === "all" || all.some((p) => (p.cat || "other") === c.k))
        .map((c) => h("button", { class: "chip glass", "aria-pressed": String(wheelCat === c.k), onclick: () => { wheelCat = c.k; lastPick = null; render(); } }, c.em ? `${c.em} ${c.name}` : c.name)));
    const mode = h("div", { class: "seg", role: "group", "aria-label": "听谁的喜好" },
      [["both", "两个人"], ["her", "听她的"], ["him", "听他的"]].map(([k, n]) =>
        h("button", { "aria-pressed": String(wheelMode === k), onclick: () => { wheelMode = k; lastPick = null; render(); } }, n)));

    let body;
    if (!all.length) {
      body = h("div", { class: "empty" }, h("strong", {}, loaded.places ? "转盘还是空的" : "正在加载…"),
        loaded.places ? h("span", {}, "先把你们常吃的餐厅加进来") : null,
        loaded.places ? h("button", { class: "btn primary", onclick: () => openPlace(null) }, "＋ 添加餐厅") : null);
    } else {
      const box = h("div", { class: "wheel-box" },
        h("canvas", { id: "wheel", width: "680", height: "680", "aria-label": `转盘，共 ${cands.length} 家餐厅` }),
        pointerSvg(),
        h("button", { class: "spin", id: "spin", disabled: spinning || !cands.length, onclick: spin }, spinning ? "…" : "转！"));
      let result;
      if (lastPick && places[lastPick]) {
        const p = places[lastPick], c = cat(p.cat), st = dishStats(p.id);
        const best = st.find((x) => x.avg >= 70), worst = [...st].reverse().find((x) => x.avg < 45);
        result = h("div", { class: "result", id: "result" },
          h("div", { class: "r-meta" }, "转盘建议"),
          h("div", { class: "r-name" }, `${c.em} ${p.name}`),
          h("div", { class: "r-meta" }, c.name + (isUnlocked(p) ? "" : " · 🔒 还没解锁，去吃一次就能解锁")),
          best ? h("div", { class: "r-tip" }, `可以点：${best.name} ${taste(best.avg)[0]}`) : null,
          worst ? h("div", { class: "r-tip" }, `别再点：${worst.name} ${taste(worst.avg)[0]}`) : null,
          h("div", { class: "btns" },
            h("button", { class: "btn", onclick: spin }, "再转一次"),
            h("button", { class: "btn primary", onclick: () => openMeal({ date: todayStr(), placeId: p.id }) }, "就吃这个")),
          h("div", { class: "r-note" }, "只是建议，点“就吃这个”才会记下来"));
      } else {
        const hint = wheelMode === "both" ? "两个人都爱吃的格子最大" : `${WHO[wheelMode]}爱吃的格子更大，不想吃的很小`;
        result = h("div", { class: "result" }, h("div", { class: "muted" }, `${cands.length} 家 · ${hint}`));
      }
      body = [mode, box, result];
    }
    return [
      h("div", { class: "sec-h" }, h("h2", {}, "今天"), h("span", {}, todays.length ? `${todays.length} 顿` : "")),
      todayCard,
      h("div", { class: "sec-h" }, h("h2", {}, "转盘"), h("button", { class: "mini glass", onclick: () => openPlace(null) }, "＋ 新餐厅")),
      all.length ? chips : null,
      h("div", { class: "card wheel-card" }, body),
    ];
  }

  function pointerSvg() {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("class", "pointer"); s.setAttribute("viewBox", "0 0 30 36");
    s.innerHTML = '<path d="M15 35 2 10a13 13 0 1 1 26 0z" fill="var(--accent)"/><circle cx="15" cy="12" r="5" fill="#fff"/>';
    return s;
  }

  /* ---------- wheel: every added restaurant is on it; preferences only change slice size ---------- */
  const PW = { love: 2, ok: 1, "": 1, no: .4 };
  function weightFor(p) {
    const prefs = wheelMode === "both" ? [p.prefHer || "", p.prefHim || ""] : [(wheelMode === "her" ? p.prefHer : p.prefHim) || ""];
    return prefs.reduce((w, x) => w * (PW[x] ?? 1), 1);
  }
  function candidates() {
    return placeList()
      .filter((p) => wheelCat === "all" || (p.cat || "other") === wheelCat)
      .map((p) => ({ p, w: weightFor(p) }))
      .sort((a, b) => (a.p.cat || "").localeCompare(b.p.cat || "") || (a.p.createdAt || "").localeCompare(b.p.createdAt || ""));
  }
  function drawWheel() {
    const cv = $("#wheel"); if (!cv) return;
    const ctx = cv.getContext("2d"), S = cv.width, R = S / 2 - 6;
    const cs = getComputedStyle(document.documentElement);
    const cands = candidates();
    ctx.clearRect(0, 0, S, S);
    ctx.save(); ctx.translate(S / 2, S / 2);
    const total = cands.reduce((s, x) => s + x.w, 0);
    let a = wheelAngle - Math.PI / 2;
    const font = cs.getPropertyValue("--font");
    cands.forEach((x, i) => {
      const span = x.w / total * Math.PI * 2;
      const col = cs.getPropertyValue(`--c-${cat(x.p.cat).k}`).trim();
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, a, a + span); ctx.closePath();
      ctx.fillStyle = col; ctx.globalAlpha = i % 2 ? .8 : 1; ctx.fill(); ctx.globalAlpha = 1;
      if (cands.length > 1) { ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 4; ctx.stroke(); }
      const mid = a + span / 2, left = Math.cos(mid) < 0;
      ctx.save(); ctx.rotate(left ? mid + Math.PI : mid);
      ctx.fillStyle = "#fff"; ctx.textAlign = left ? "left" : "right"; ctx.textBaseline = "middle";
      ctx.shadowColor = "rgba(0,0,0,.25)"; ctx.shadowBlur = 4;
      const fs = Math.max(18, Math.min(32, span * R * .4));
      ctx.font = `700 ${fs}px ${font}`;
      let label = x.p.name; if (label.length > 7) label = label.slice(0, 6) + "…";
      if (!isUnlocked(x.p)) label = "🔒" + label;
      if (span * R > 20) ctx.fillText(label, left ? -(R - 24) : R - 24, 0);
      ctx.restore();
      a += span;
    });
    // glass sheen
    const sheen = ctx.createLinearGradient(0, -R, 0, R);
    sheen.addColorStop(0, "rgba(255,255,255,.28)"); sheen.addColorStop(.5, "rgba(255,255,255,0)");
    ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fillStyle = sheen; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.lineWidth = 5; ctx.stroke();
    ctx.restore();
  }
  function spin() {
    const cands = candidates(); if (!cands.length || spinning) return;
    const total = cands.reduce((s, x) => s + x.w, 0);
    let r = Math.random() * total, idx = 0;
    for (; idx < cands.length; idx++) { r -= cands[idx].w; if (r <= 0) break; }
    idx = Math.min(idx, cands.length - 1);
    let start = 0; for (let i = 0; i < idx; i++) start += cands[i].w;
    const mid = (start + cands[idx].w * (.2 + Math.random() * .6)) / total * Math.PI * 2;
    const TAU = Math.PI * 2, from = wheelAngle;
    const to = from - (from % TAU) + TAU * 6 + (((-mid) % TAU) + TAU) % TAU;
    const dur = reduceMotion() ? 1 : 3800, t0 = performance.now();
    spinning = true; lastPick = null;
    const btn = $("#spin"); if (btn) { btn.disabled = true; btn.textContent = "…"; }
    const step = (t) => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 4);
      wheelAngle = from + (to - from) * e; drawWheel();
      if (k < 1) requestAnimationFrame(step);
      else { spinning = false; wheelAngle = to % TAU; lastPick = cands[idx].p.id; render(); $("#result")?.scrollIntoView({ block: "nearest", behavior: reduceMotion() ? "auto" : "smooth" }); }
    };
    requestAnimationFrame(step);
  }

  /* ---------- calendar ---------- */
  function viewCal() {
    const lead = (new Date(calY, calM, 1).getDay() + 6) % 7;
    const days = new Date(calY, calM + 1, 0).getDate();
    const byDay = {}; for (const m of meals) (byDay[m.date] ||= []).push(m);
    const t = todayStr();
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push(h("div", { class: "day out", "aria-hidden": "true" }));
    for (let d = 1; d <= days; d++) {
      const ds = ymd(new Date(calY, calM, d));
      const ms = (byDay[ds] || []).sort((a, b) => slotIdx(a) - slotIdx(b));
      cells.push(h("button", { class: "day" + (ds === t ? " today" : ""), "aria-pressed": String(ds === selDay), "aria-label": `${md(ds)}，${ms.length} 顿`, onclick: () => { selDay = ds; render(); } },
        h("span", { class: "n" }, d), h("span", { class: "em" }, ms.slice(0, 3).map((m) => cat(places[m.placeId]?.cat).em).join(""))));
    }

      return { x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 5, r: Math.random() * 3, vr: (Math.random() - .5) * .35, w: 6 + Math.random() * 7, h: 3 + Math.random() * 4, c: cols[(Math.random() * cols.length) | 0], life: 1, round: Math.random() < .3 };
    });
    const step = () => {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      let alive = 0;
      for (const p of ps) {
        p.vy += .22; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .006;
        if (p.life <= 0 || p.y > innerHeight + 20) continue; alive++;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.min(1, p.life * 1.5); ctx.fillStyle = p.c;
        if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.h, 0, Math.PI * 2); ctx.fill(); } else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.restore();
      }
      if (alive) confettiRAF = requestAnimationFrame(step); else ctx.clearRect(0, 0, innerWidth, innerHeight);
    };
    confettiRAF = requestAnimationFrame(step);
  }

  /* ---------- wiring ---------- */
  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
    tab = b.dataset.tab; try { history.replaceState(null, "", "#" + tab); } catch {}
    render(); scrollTo({ top: 0 });
  }));
  $("#add").addEventListener("click", () => tab === "places" ? openPlace(null) : openMeal({ date: tab === "cal" ? selDay : todayStr() }));
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => tab === "today" && drawWheel());
  new MutationObserver(() => tab === "today" && drawWheel()).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  render();

  (async () => {
    const c = window.claude;
    const notice = (msg) => { const n = $("#notice"); n.textContent = msg; n.hidden = false; };
    if (!c?.use) { loaded = { places: true, meals: true }; notice("在 Claude 里打开这个页面，才能保存和同步。"); render(); return; }
    const [d, user] = await Promise.all([c.use("db"), c.use("user")]);
    db = d;
    if (user) {
      me = await user.id();
      myRole = (await user.isOwner()) ? "her" : "him";
      if ((await user.can("data.write")) === false) { readOnly = true; notice("你现在只能查看。想一起记录，请让她在“分享”里把你设为“编辑者”。"); }
    }
    if (!db) { loaded = { places: true, meals: true }; notice("没连上存储：请先登录 Claude 再打开。"); render(); return; }
    let first = true;
    db.collection("places").onSnapshot((snap) => {
      const next = {};
      for (const doc of snap.docs) next[doc.id] = { id: doc.id, ...doc.data() };
      if (!first) for (const p of Object.values(next)) {
        const prev = places[p.id];
        if (prev && !isUnlocked(prev) && isUnlocked(p) && !p.isDefault) setTimeout(() => celebrate(p), 400);
      }
      first = false; places = next; loaded.places = true;
      if (!spinning) render();
    }, () => notice("同步中断了，刷新一下页面。"));
    db.collection("meals").onSnapshot((snap) => {
      meals = snap.docs.map((doc) => ({ id: doc.id, ...doc.data() })).filter((m) => m.date);
      loaded.meals = true;
      if (!spinning) render();
    }, () => notice("同步中断了，刷新一下页面。"));
  })();
})();
</script>
